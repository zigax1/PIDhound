name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
      - name: Build
        run: |
          make build
          ./scripts/generate-icon.sh
          VERSION="${{ steps.version.outputs.VERSION }}" ./scripts/build-app-bundle.sh
          VERSION="${{ steps.version.outputs.VERSION }}" ./scripts/build-dmg.sh
      - name: Compute SHA256
        id: sha
        run: |
          SHA=$(shasum -a 256 "dist/PIDhound-${{ steps.version.outputs.VERSION }}.dmg" | awk '{print $1}')
          echo "SHA256=${SHA}" >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: "v${{ steps.version.outputs.VERSION }}"
          body: |
            ## Install

            Download `PIDhound-${{ steps.version.outputs.VERSION }}.dmg`, open it, drag PIDhound to Applications.

            **First launch:** right-click -> Open (the app is unsigned for this release).

            ### SHA256
            ```
            ${{ steps.sha.outputs.SHA256 }}
            ```
          files: dist/PIDhound-${{ steps.version.outputs.VERSION }}.dmg
