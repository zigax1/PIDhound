name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
      - name: Build
        run: |
          make build
          ./scripts/generate-icon.sh
          VERSION="${{ steps.version.outputs.VERSION }}" ./scripts/build-app-bundle.sh
          VERSION="${{ steps.version.outputs.VERSION }}" ./scripts/build-dmg.sh
      - name: Compute SHA256
        id: sha
        run: |
          SHA=$(shasum -a 256 "dist/PIDhound-${{ steps.version.outputs.VERSION }}.dmg" | awk '{print $1}')
          echo "SHA256=${SHA}" >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: "v${{ steps.version.outputs.VERSION }}"
          body: |
            ## Install

            Download `PIDhound-${{ steps.version.outputs.VERSION }}.dmg`, open it, drag PIDhound to Applications.

            **First launch:** the DMG is ad-hoc signed but not notarized. On macOS Sonoma, Sequoia, and Tahoe (26), Gatekeeper blocks ad-hoc signed apps on first launch. To clear the block, run this once in Terminal:

            ```sh
            xattr -dr com.apple.quarantine /Applications/PIDhound.app
            ```

            Then double-click PIDhound as usual. You only need to run this once per install.

            The **System Settings -> Privacy & Security -> Open Anyway** flow can also work on some systems, but it's unreliable for ad-hoc signed apps - if you tried it and the app still won't open (or shows "damaged"), run the command above.

            ### SHA256
            ```
            ${{ steps.sha.outputs.SHA256 }}
            ```
          files: dist/PIDhound-${{ steps.version.outputs.VERSION }}.dmg
